name: Hosted evaluation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hosted-eval.yml"

concurrency:
  group: hosted-evaluation
  cancel-in-progress: false

jobs:
  hosted-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_GENERATOR_MODEL: "@cf/google/gemma-4-26b-a4b-it"
      CLOUDFLARE_ROUTER_MODEL: "@cf/zai-org/glm-4.7-flash"
      CLOUDFLARE_EMBEDDING_MODEL: "@cf/baai/bge-small-en-v1.5"
      CLOUDFLARE_RERANKER_MODEL: "@cf/baai/bge-reranker-base"
      USE_CLOUDFLARE_RETRIEVAL: "true"
      USE_SUPABASE: "true"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify hosted credentials
        run: |
          python - <<'PY'
          import os
          required = [
              "CLOUDFLARE_ACCOUNT_ID",
              "CLOUDFLARE_API_TOKEN",
              "SUPABASE_URL",
              "SUPABASE_PUBLISHABLE_KEY",
          ]
          missing = [name for name in required if not os.getenv(name)]
          if missing:
              raise SystemExit(
                  "Missing GitHub Actions credentials: " + ", ".join(missing)
              )
          print("Hosted evaluation credentials are available.")
          PY

      - name: Install lightweight hosted dependencies
        run: |
          python -m pip install --disable-pip-version-check -r deploy/requirements.txt

      - name: Run hosted evaluation
        env:
          PYTHONPATH: src
        run: python scripts/evaluate_hosted.py --output-dir eval/results/hosted

      - name: Upload raw hosted evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-evaluation-results
          path: eval/results/hosted/
          if-no-files-found: warn
          retention-days: 30
