name: Validate repository

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax-and-notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python -m compileall -q app.py deploy scripts src

      - name: Validate notebook and evaluation JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path("notebooks").glob("*.ipynb")):
              with path.open(encoding="utf-8") as handle:
                  notebook = json.load(handle)
              assert notebook["nbformat"] == 4
              assert notebook["cells"], f"{path} has no cells"
              for i, cell in enumerate(notebook["cells"]):
                  if cell.get("cell_type") == "code":
                      assert not cell.get("outputs"), f"{path} cell {i} has committed outputs"
                      assert cell.get("execution_count") is None, (
                          f"{path} cell {i} has an execution count"
                      )
              print(f"{path}: {len(notebook['cells'])} cells, outputs clean")

          with Path("eval/questions.json").open(encoding="utf-8") as handle:
              questions = json.load(handle)
          assert questions, "Evaluation set is empty"
          assert all("question" in item and "reference_answer" in item for item in questions)
          print(f"eval/questions.json: {len(questions)} questions")

          with Path("eval/routing_questions.json").open(encoding="utf-8") as handle:
              routing_questions = json.load(handle)
          assert routing_questions, "Routing evaluation set is empty"
          assert all(
              {"question", "expected_route", "has_observation"} <= item.keys()
              for item in routing_questions
          )
          print(f"eval/routing_questions.json: {len(routing_questions)} questions")

          generated_results = [
              path
              for path in Path("eval/results").iterdir()
              if path.name != ".gitkeep"
          ]
          assert not generated_results, (
              "Generated eval artifacts must not be committed: "
              + ", ".join(str(path) for path in generated_results)
          )

          forbidden = [
              Path(".env"),
              Path(".streamlit/secrets.toml"),
              Path("requirements.txt"),
              Path("requirements-dev.txt"),
              Path("RUNNING.md"),
          ]
          tracked_forbidden = [str(path) for path in forbidden if path.exists()]
          assert not tracked_forbidden, (
              "Unexpected public-repo artifacts: " + ", ".join(tracked_forbidden)
          )
          print("Repository hygiene checks passed")
          PY


  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            pytest==8.4.2 \
            numpy==2.5.3 \
            pandas==3.0.6 \
            requests==2.34.2 \
            langchain==1.4.2 \
            langgraph==1.2.11 \
            rank-bm25==0.2.2 \
            supabase==2.31.0

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: pytest -q tests
